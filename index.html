а."},{"k":"ПРОТОКОЛ ЭКСПЕРИМЕНТА","t":"Импульс системы до и после столкновения","d":"Сравните суммарный импульс тележек до и после взаимодействия. Скорости учитываются с направлением. Проведите не менее трёх повторов, оцените погрешность.","n":"Показать таблицу измерений, единицы и направления."},{"k":"АНАЛИЗ ДАННЫХ","t":"Что означает несовпадение?","d":"Трение, наклон трека, ошибки измерения скорости, несинхронность кадров. Отдельно сравните импульс и кинетическую энергию.","n":"Обсудить неопределённость и систематические ошибки."},{"k":"11 КЛАСС · ВОЛНЫ","t":"Механические и электромагнитные","d":"Общие характеристики: частота, длина волны, скорость, интенсивность. Различие: механическим волнам нужна среда, электромагнитным — нет.","n":"Сравнить среды распространения и поперечность электромагнитных волн."},{"k":"ШУМОВОЕ ЗАГРЯЗНЕНИЕ","t":"Как измеряется уровень шума","d":"Обсудите логарифмическую шкалу децибел: удвоение интенсивности повышает уровень примерно на 3 дБ. Учитывайте длительность воздействия.","n":"Разобрать логарифмическую шкалу без путаницы интенсивности и давления."},{"k":"ПРАКТИКУМ · ШУМ","t":"Измеряем акустическую среду","d":"Сравните шум в классе, коридоре и у дороги. Смартфон подходит для учебного сравнения, но не заменяет поверенный шумомер.","n":"Предложить школьный мини-проект с соблюдением безопасности."},{"k":"РАДИОЛОКАЦИЯ","t":"Определение расстояния с помощью радара","d":"Радиосигнал проходит расстояние до объекта и обратно. Выведите зависимость дальности от времени задержки и скорости распространения сигнала.","n":"Показать двукратный путь импульса."},{"k":"ЗАДАЧА · РАДАР","t":"Практическая задача о радиолокации","d":"Отражённый радиосигнал вернулся через 200 мкс. Определите расстояние до объекта. Обсудите ограничения метода и проверьте единицы.","n":"Решить вместе с аудиторией и проверить единицы."},{"k":"11 КЛАСС · НАЧАЛО ОПТИКИ","t":"От лучевой модели к волновой","d":"Сначала границы применимости геометрической оптики, затем отражение, ').innerHTML=slides.map((item,i)=>`<button class="slide-dot ${i===idx?'active':''}" data-index="${i}" title="Слайд ${i+1}: ${item.t.replace(/&/g,'&amp;').replace(/"/g,'&quot;')}"><span class="mini-top"></span><span class="mini-title">${item.t}</span><span class="mini-line"></span><span class="mini-line short"></span><span class="mini-number">${i+1}</span></button>`).join('');initPaperDrag();canvas.classList.toggle('active',drawing&&!paperCanvas);$('slideNav').querySelector('.active')?.scrollIntoView({block:'nearest',inline:'nearest'});location.hash='slide-'+(idx+1);strokes=[];repaint()}
const notebookMemory={};
// Пометки хранятся только в памяти открытой страницы; обновление очищает их.
function saveNotebook(){if(!paperCanvas)return;notebookMemory[idx]={strokes:JSON.parse(JSON.stringify(paperStrokes))};}
let paperStrokes=[],paperCanvas=null,paperCtx=null,activePaperStroke=null;
function initPaperDrag(){
 const paper=$('slide').querySelector('.notebook');paperCanvas=null;paperCtx=null;paperStrokes=JSON.parse(JSON.stringify(notebookMemory[idx]?.strokes||[]));
 if(!paper)return;
 const slide=$('slide'),paperRect=paper.getBoundingClientRect(),slideRect=slide.getBoundingClientRect();
 const initialY=Math.max(0,slideRect.bottom-paperRect.top-76);
 const startX=0,startY=initialY;paper.dataset.x=String(startX);paper.dataset.y=String(startY);
 paper.style.transform=`translate(${startX}px,${startY}px)`;
 const grip=paper.querySelector('.notebook-label');
 paperCanvas=paper.querySelector('.paper-ink');paperCtx=paperCanvas.getContext('2d');
 function fit(){if(!paperCanvas)return;const r=paperCanvas.getBoundingClientRect(),d=devicePixelRatio||1;paperCanvas.width=Math.round(r.width*d);paperCanvas.height=Math.round(r.height*d);paperCtx.setTransform(d,0,0,d,0,0);paintPaper()}
 function paperPoint(e){const r=paperCanvas.getBoundingClientRect();return [(e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height]}
 paperCanvas.addEventListener('pointerdown',e=>{e.preventDefault();paperCanvas.setPointerCapture(e.pointerId);activePaperStroke={color:$('color').value,width:+$('size').value,points:[paperPoint(e)]};paperStrokes.push(activePaperStroke);paintPaper()});
 paperCanvas.addEventListener('pointermove',e=>{if(!activePaperStroke)return;activePaperStroke.points.push(paperPoint(e));paintPaper()});
 const finishInk=()=>{if(activePaperStroke){activePaperStroke=null;saveNotebook()}};
 paperCanvas.addEventListener('pointerup',finishInk);paperCanvas.addEventListener('pointercancel',finishInk);
 let drag=null;
 grip.addEventListener('pointerdown',e=>{e.preventDefault();drag={id:e.pointerId,x:e.clientX,y:e.clientY,ox:Number(paper.dataset.x||0),oy:Number(paper.dataset.y||0)};grip.setPointerCapture(e.pointerId);paper.classList.add('dragging')});
 grip.addEventListener('pointermove',e=>{if(!drag||drag.id!==e.pointerId)return;const x=drag.ox+e.clientX-drag.x,y=drag.oy+e.clientY-drag.y;paper.dataset.x=x;paper.dataset.y=y;paper.style.transform=`translate(${x}px,${y}px)`});
 const endDrag=()=>{if(drag)saveNotebook();drag=null;paper.classList.remove('dragging')};grip.addEventListener('pointerup',endDrag);grip.addEventListener('pointercancel',endDrag);
 requestAnimationFrame(fit);
}
function paintPaper(){if(!paperCanvas||!paperCtx)return;paperCtx.clearRect(0,0,paperCanvas.width,paperCanvas.height);for(const s of paperStrokes){paperCtx.beginPath();paperCtx.strokeStyle=s.color;paperCtx.lineWidth=s.width;paperCtx.lineJoin='round';paperCtx.lineCap='round';s.points.forEach((p,i)=>i?paperCtx.lineTo(p[0]*paperCanvas.clientWidth,p[1]*paperCanvas.clientHeight):paperCtx.moveTo(p[0]*paperCanvas.clientWidth,p[1]*paperCanvas.clientHeight));if(s.points.length===1){let p=s.points[0];paperCtx.lineTo(p[0]*paperCanvas.clientWidth+.1,p[1]*paperCanvas.clientHeight+.1)}paperCtx.stroke()}}
function move(d){saveNotebook();idx=Math.min(slides.length-1,Math.max(0,idx+d));render();updateCornerNav()}function updateCornerNav(){$('cornerPrev').disabled=idx===0;$('cornerNext').disabled=idx===slides.length-1}$('slideNav').onclick=e=>{const b=e.target.closest('[data-index]');if(b){saveNotebook();idx=+b.dataset.index;render();updateCornerNav()}};$('next').onclick=()=>move(1);$('prev').onclick=()=>move(-1);$('cornerNext').onclick=()=>move(1);$('cornerPrev').onclick=()=>move(-1);$('draw').onclick=()=>{drawing=!drawing;canvas.classList.toggle('active',drawing&&!paperCanvas);$('tools').classList.toggle('show',drawing)};$('close').onclick=()=>{$('draw').click()};$('full').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen?.();$('undo').onclick=()=>{if(paperCanvas){paperStrokes.pop();paintPaper();saveNotebook()}else{strokes.pop();repaint()}};$('clear').onclick=()=>{if(paperCanvas){paperStrokes=[];paintPaper();saveNotebook()}else{strokes=[];repaint()}};function point(e){let r=canvas.getBoundingClientRect();return[(e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height]}canvas.addEventListener('pointerdown',e=>{if(!drawing)return;painting=true;canvas.setPointerCapture(e.pointerId);current={color:$('color').value,width:+$('size').value,points:[point(e)]};strokes.push(current);repaint()});canvas.addEventListener('pointermove',e=>{if(!painting)return;current.points.push(point(e));repaint()});canvas.addEventListener('pointerup',()=>painting=false);window.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();move(1)}if(e.key==='ArrowLeft')move(-1);if(e.key.toLowerCase()==='f')$('full').click()});window.addEventListener('resize',resize);idx=Math.max(0,Math.min(slides.length-1,(parseInt(location.hash.replace('#slide-',''))||1)-1));render();resize();
updateCornerNav();</script></body></html>
